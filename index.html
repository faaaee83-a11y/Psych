<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Friday Night Funkin': Psych Engine</title>

	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes">

	<link rel="shortcut icon" type="image/png" href="./favicon.png">

	<script type="text/javascript" src="./PsychEngine.js"></script>

	<script>
		// タッチ操作によるスクロール・ズームを無効化
		window.addEventListener ("touchmove", function (event) { event.preventDefault (); }, { capture: false, passive: false });

		// 矢印キー・スペース・PageUp/Down・Home/End によるスクロールを無効化
		// (keyCode: 32=Space 33=PageUp 34=PageDown 35=End 36=Home 37-40=矢印)
		var blockedKeyCodes = [32, 33, 34, 35, 36, 37, 38, 39, 40];
		function blockScrollKeys (event) {
			if (blockedKeyCodes.indexOf (event.keyCode) !== -1) {
				event.preventDefault ();
			}
		}
		window.addEventListener ("keydown", blockScrollKeys, { capture: true, passive: false });
		document.addEventListener ("keydown", blockScrollKeys, { capture: true, passive: false });

		// 万が一スクロールされても、すぐ元の位置に戻す
		window.addEventListener ("scroll", function () { window.scrollTo (0, 0); });

		// 読み込み後・クリック時にこのページへフォーカスを移す
		window.addEventListener ("load", function () { window.focus (); });
		window.addEventListener ("mousedown", function () { window.focus (); });

		// 右クリックメニューとホイールスクロールを無効化
		window.addEventListener ("contextmenu", function (event) { event.preventDefault (); });
		window.addEventListener ("wheel", function (event) { event.preventDefault (); }, { passive: false });

		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById ("viewport");
			meta.setAttribute ('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>

	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			overscroll-behavior: none;
			background: #000000;
			position: fixed;          /* ページ自体を固定 */
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
		}

		/* 16:9 を維持したまま、画面に収まる最大サイズで中央配置 */
		#openfl-content {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: min(100vw, calc(100vh * 16 / 9));
			height: min(100vh, calc(100vw * 9 / 16));
			background: #000000;
		}

		@font-face {
			font-family: 'Pixel Arial 11 Bold';
			src: url('assets/fonts/pixel.otf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'VCR OSD Mono';
			src: url('assets/fonts/vcr.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Nokia Cellphone FC Small';
			src: url('flixel/fonts/nokiafc22.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Monsterrat';
			src: url('flixel/fonts/monsterrat.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
	</style>
</head>
<body>
	<noscript>This webpage makes extensive use of JavaScript. Please enable JavaScript in your web browser to view this page.</noscript>

	<div id="openfl-content"></div>

	<script type="text/javascript">
		lime.embed ("PsychEngine", "openfl-content", 1280, 720, { parameters: {} });
	</script>
</body>
</html>
